# Strada API en x99 — sin dominio propio (HTTPS vía Cloudflare Tunnel)
services:
  strada-api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: strada-api
    restart: unless-stopped
    expose:
      - "8788"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "8788"
    volumes:
      - /mnt/M5/strada-api/data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8788/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    container_name: strada-caddy
    restart: unless-stopped
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      strada-api:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: strada-cf-tunnel
    restart: unless-stopped
    network_mode: host
    command: tunnel --no-autoupdate --url http://127.0.0.1:80
    depends_on:
      - caddy
